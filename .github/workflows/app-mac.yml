name: App Mac
on:
  push:
    branches: [main]
    paths: ["natif/**", ".github/workflows/app-mac.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  construire:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Construire
        run: natif/construire-mac.sh
      - name: Contrôler la lecture des éditions publiées
        # Le modèle de l'app doit lire chaque bloc des éditions en ligne, sinon l'app reste sur une ancienne édition.
        run: |
          mkdir -p natif/build/controle
          swiftc -O natif/Sources/Modele.swift natif/Controle/main.swift -o natif/build/controle/controle
          cd natif/build/controle
          for f in fr/edition/edition.json fr/hebdo/hebdo.json pt/edition/edition.json pt/hebdo/hebdo.json; do
            curl -fsS "https://adrienrochestudio.github.io/actualites/$f" -o "${f%%/*}-$(basename "$f")" || echo "absent : $f"
          done
          ./controle *.json
      - name: Mesurer le changement de langue
        if: github.ref != 'refs/heads/main'
        run: |
          rm -rf ~/Library/Application\ Support/Actualites
          "natif/build/Actualités.app/Contents/MacOS/Actualites" --diagnostic > diag.log 2>&1 &
          pid=$!
          for i in $(seq 180); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          grep MESURE diag.log || tail -40 diag.log
      - name: Publier dans la release "mac"
        # Une autre branche ne fait que vérifier la compilation.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view mac >/dev/null 2>&1 || gh release create mac --title "App Mac" --notes "Dernière version de l'app Mac Actualités."
          # Le zip d'abord, la version ensuite : une app ne voit la nouvelle version qu'une fois le zip en ligne.
          gh release upload mac natif/build/Actualites-mac.zip --clobber
          gh release upload mac natif/build/mac-version.txt --clobber
  # Branches de contrôle : même mesure sur la version récente de macOS (colonne latérale flottante, autre comportement des clics).
  diagnostic-recent:
    if: github.ref != 'refs/heads/main'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Construire
        run: sw_vers && natif/construire-mac.sh
      - name: Mesurer le changement de langue
        run: |
          rm -rf ~/Library/Application\ Support/Actualites
          "natif/build/Actualités.app/Contents/MacOS/Actualites" --diagnostic > diag.log 2>&1 &
          pid=$!
          for i in $(seq 180); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          grep MESURE diag.log || tail -40 diag.log
